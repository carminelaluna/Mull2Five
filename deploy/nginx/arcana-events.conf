server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Security headers ──────────────────────────────
    add_header X-Frame-Options           "DENY"                  always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy
      "default-src 'self';
       script-src 'self' https://cdnjs.cloudflare.com;
       style-src 'self' 'unsafe-inline';
       img-src 'self' data: https://api.scryfall.com https://cards.scryfall.io;
       connect-src 'self' https://nominatim.openstreetmap.org;
       font-src 'self';
       frame-ancestors 'none'"
      always;

    # ── Frontend statico (build Vite) ─────────────────
    root /opt/arcana-events/frontend/dist;

    location / {
        try_files $uri $uri.html $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Assets con hash Vite — cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Backend API ───────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location /docs    { proxy_pass http://127.0.0.1:8000; }
    location /openapi { proxy_pass http://127.0.0.1:8000; }
}
