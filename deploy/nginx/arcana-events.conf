# Config nginx HTTP-only: parte senza certificati.
# Per HTTPS: dopo che nginx gira ed esiste un dominio puntato all'IP, esegui
#   sudo certbot --nginx -d tuo-dominio.com
# certbot inietta automaticamente il blocco 443 + i certificati e il redirect.
server {
    listen 80;
    server_name _;            # sostituisci con il tuo dominio quando ce l'hai

    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Security headers (HSTS lo aggiunge certbot con HTTPS) ──
    add_header X-Frame-Options        "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Frontend statico (build Vite) ─────────────────
    root /opt/manabind/frontend/dist;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Backend API ───────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health  { proxy_pass http://127.0.0.1:8000; }
    location /docs    { proxy_pass http://127.0.0.1:8000; }
    location /openapi { proxy_pass http://127.0.0.1:8000; }
}
