  <body>
    <main class="auth-page">
      <div class="auth-card" style="max-width:420px;margin:60px auto">
        <h2>Password dimenticata</h2>
        <p class="muted">Inserisci la tua email: ti invieremo un link per reimpostare la password (valido 30 minuti).</p>
        <form class="auth-form" id="forgotForm">
          <label>Email
            <input id="forgotEmail" type="email" required placeholder="tu@email.com" autocomplete="email" />
          </label>
          <p class="field-error" id="forgotError"></p>
          <p id="forgotOk" style="display:none;color:var(--ok,#7bc47f)"></p>
          <button class="primary" type="submit" id="forgotBtn">Invia link di reset</button>
        </form>
        <p style="margin-top:16px"><a href="login.html">← Torna al login</a></p>
      </div>
    </main>

    <footer class="public-footer">
      <nav aria-label="Informazioni legali">
        <a href="/privacy.html">Privacy</a>
        <a href="/termini.html">Termini</a>
        <a href="/cookie.html">Cookie</a>
        <a href="/docs">API</a>
      </nav>
      <p>© 2026 Mull2Five · Non affiliato a Wizards of the Coast</p>
    </footer>
    <script type="module">
      async function apiForgotPassword(email) {
        const r = await fetch('/api/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || r.statusText);
        return data;
      }

      document.querySelector('#forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.querySelector('#forgotBtn');
        const errEl = document.querySelector('#forgotError');
        const okEl  = document.querySelector('#forgotOk');
        errEl.textContent = ''; okEl.style.display = 'none';
        btn.disabled = true;
        try {
          const resp = await apiForgotPassword(document.querySelector('#forgotEmail').value.trim());
          okEl.textContent = resp.detail;
          okEl.style.display = 'block';
        } catch (err) {
          errEl.textContent = err.message;
        } finally {
          btn.disabled = false;
        }
      });
    </script>
    <script type="module" src="js/site.js"></script>
  </body>
</html>
