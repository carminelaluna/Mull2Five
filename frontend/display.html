<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display Torneo — Mull2Five</title>
    <style>
      /* Schermo TV: alto contrasto, caratteri grandi, zero interazione */
      :root { --bg:#0d0d0f; --fg:#ffffff; --muted:#9a9aa5; --accent:#c6ff3d; --line:#2a2a31; }
      * { margin:0; padding:0; box-sizing:border-box; }
      body { background:var(--bg); color:var(--fg); font-family:system-ui,Arial,sans-serif; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
      header { display:flex; justify-content:space-between; align-items:center; padding:24px 48px; border-bottom:2px solid var(--line); }
      h1 { font-size:clamp(24px,3.5vw,48px); }
      .round-info { text-align:right; }
      .round-label { font-size:clamp(18px,2vw,28px); color:var(--muted); }
      #timer { font-size:clamp(40px,6vw,96px); font-variant-numeric:tabular-nums; color:var(--accent); font-weight:bold; line-height:1; }
      #timer.expired { color:#ef6a5e; animation:blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity:.25; } }
      main { flex:1; overflow:hidden; padding:24px 48px; }
      h2 { font-size:clamp(20px,2.5vw,36px); color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:16px; }
      table { width:100%; border-collapse:collapse; font-size:clamp(20px,2.6vw,40px); }
      td, th { padding:.35em .5em; border-bottom:1px solid var(--line); text-align:left; }
      th { color:var(--muted); font-size:.6em; text-transform:uppercase; letter-spacing:.1em; }
      .table-num { color:var(--accent); font-weight:bold; width:2.5em; }
      .pos { color:var(--accent); font-weight:bold; width:2.5em; }
      .pts { font-weight:bold; text-align:right; }
      .done { color:var(--muted); }
      .table-extra { color:var(--accent); font-variant-numeric:tabular-nums; font-weight:bold; }
      .table-extra.over { color:#ef6a5e; }
      #message { display:flex; align-items:center; justify-content:center; height:100%; font-size:clamp(24px,3vw,48px); color:var(--muted); text-align:center; }
      footer { padding:12px 48px; color:var(--muted); font-size:14px; border-top:1px solid var(--line); display:flex; justify-content:space-between; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="tournamentName">Mull2Five</h1>
      <div class="round-info">
        <div class="round-label" id="roundLabel"></div>
        <div id="timer"></div>
      </div>
    </header>
    <main id="content"><div id="message">Collegamento…</div></main>
    <footer>
      <span>Mull2Five — display pubblico</span>
      <span id="viewLabel"></span>
    </footer>

    <script type="module">
      import { esc } from './js/escape.js';

      /* Uso: display.html?t=ID  (+ opzionale &view=pairings|standings per bloccare la rotazione) */
      const params       = new URLSearchParams(location.search);
      const tournamentId = params.get('t');
      const fixedView    = params.get('view');           // null = rotazione automatica
      const REFRESH_MS   = 10_000;                       // allineato alla cache server (10s)
      const ROTATE_MS    = 15_000;

      let data = null;
      let view = fixedView || 'pairings';

      const $ = (sel) => document.querySelector(sel);

      if (!tournamentId) {
        $('#message').textContent = 'Aggiungi ?t=ID_TORNEO all\'indirizzo per collegare un torneo.';
        throw new Error('missing tournament id');
      }

      async function fetchData() {
        try {
          const resp = await fetch(`/api/tournaments/${tournamentId}/public-display`);
          if (!resp.ok) throw new Error(resp.status);
          data = await resp.json();
          $('#tournamentName').textContent = data.tournament_name;
          render();
        } catch {
          $('#content').innerHTML = '<div id="message">Connessione persa — riprovo…</div>';
        }
      }

      function render() {
        if (!data) return;
        $('#roundLabel').textContent = data.round_number ? `Round ${data.round_number}` : '';
        if (view === 'pairings' && data.pairings.length) renderPairings();
        else if (data.standings.length) renderStandings();
        else $('#content').innerHTML = '<div id="message">In attesa dei pairing…</div>';
        $('#viewLabel').textContent = view === 'pairings' ? 'Abbinamenti' : 'Classifica';
      }

      function renderPairings() {
        const rows = data.pairings.map(p => {
          // Tavolo con tempo extra: mostra il proprio countdown (clock per-tavolo)
          let extraCell = '';
          if (!p.result && p.extra_seconds) {
            extraCell = `<span class="table-extra" data-ends="${p.ends_at || ''}">+${Math.round(p.extra_seconds/60)}′</span>`;
          }
          return `<tr class="${p.result ? 'done' : ''}">
            <td class="table-num">${p.table_number}</td>
            <td>${esc(p.player_a)}</td>
            <td>${p.player_b ? esc(p.player_b) : '— BYE —'}</td>
            <td>${p.result ? '✓' : extraCell}</td>
          </tr>`;
        }).join('');
        $('#content').innerHTML = `<h2>Abbinamenti</h2>
          <table><thead><tr><th>Tavolo</th><th>Giocatore</th><th>Avversario</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table>`;
      }

      function renderStandings() {
        const rows = data.standings.map(s => `
          <tr>
            <td class="pos">${s.position}</td>
            <td>${esc(s.name)}</td>
            <td>${s.record}</td>
            <td class="pts">${s.points}</td>
          </tr>`).join('');
        $('#content').innerHTML = `<h2>Classifica</h2>
          <table><thead><tr><th>#</th><th>Giocatore</th><th>Record</th><th>Punti</th></tr></thead>
          <tbody>${rows}</tbody></table>`;
      }


      /* Timer del round: countdown da round_ends_at */
      function tickTimer() {
        const el = $('#timer');
        if (!data?.round_ends_at) { el.textContent = ''; return; }
        const remaining = Math.floor((new Date(data.round_ends_at) - Date.now()) / 1000);
        // Dopo lo zero il clock prosegue in negativo (turni supplementari)
        el.classList.toggle('expired', remaining <= 0);
        const neg = remaining < 0;
        const abs = Math.abs(remaining);
        const m = Math.floor(abs / 60), s = abs % 60;
        el.textContent = `${neg ? '-' : ''}${m}:${String(s).padStart(2, '0')}`;

        // Clock per-tavolo (tavoli con tempo extra): countdown indipendente
        document.querySelectorAll('.table-extra[data-ends]').forEach(span => {
          const ends = span.dataset.ends ? new Date(span.dataset.ends) : null;
          if (!ends) return;
          const r = Math.floor((ends - Date.now()) / 1000);
          const n = r < 0, a = Math.abs(r);
          span.textContent = `${n ? '-' : ''}${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}`;
          span.classList.toggle('over', r <= 0);
        });
      }

      fetchData();
      setInterval(fetchData, REFRESH_MS);
      setInterval(tickTimer, 1000);
      if (!fixedView) {
        setInterval(() => { view = view === 'pairings' ? 'standings' : 'pairings'; render(); }, ROTATE_MS);
      }
    </script>
  </body>
</html>
