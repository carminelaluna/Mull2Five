    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:type" content="website" />

  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card" style="max-width:420px;margin:60px auto">
        <h2>Reimposta la password</h2>
        <form class="auth-form" id="resetForm">
          <label>Nuova password
            <input id="resetPassword" type="password" required minlength="8" placeholder="Min. 8 caratteri" autocomplete="new-password" />
          </label>
          <label>Conferma password
            <input id="resetConfirm" type="password" required placeholder="Ripeti la password" autocomplete="new-password" />
          </label>
          <p class="field-error" id="resetError"></p>
          <p id="resetOk" style="display:none;color:var(--ok,#7bc47f)"></p>
          <button class="primary" type="submit" id="resetBtn">Aggiorna password</button>
        </form>
        <p style="margin-top:16px"><a href="login.html">← Torna al login</a></p>
      </div>
    </main>

    <footer class="public-footer">
      <nav aria-label="Informazioni legali">
        <a href="/privacy.html">Privacy</a>
        <a href="/termini.html">Termini</a>
        <a href="/cookie.html">Cookie</a>
        <a href="/docs">API</a>
      </nav>
      <p>© 2026 Mull2Five · Non affiliato a Wizards of the Coast</p>
    </footer>
    <script type="module">
      async function apiResetPassword(token, newPassword) {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || r.statusText);
        return data;
      }

      const token = new URLSearchParams(location.search).get('token') || '';
      const errEl = document.querySelector('#resetError');
      const okEl  = document.querySelector('#resetOk');

      if (!token) errEl.textContent = 'Link non valido: token mancante. Richiedi un nuovo reset.';

      document.querySelector('#resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.textContent = ''; okEl.style.display = 'none';
        const pw = document.querySelector('#resetPassword').value;
        if (pw !== document.querySelector('#resetConfirm').value) {
          errEl.textContent = 'Le password non coincidono.'; return;
        }
        const btn = document.querySelector('#resetBtn');
        btn.disabled = true;
        try {
          const resp = await apiResetPassword(token, pw);
          okEl.textContent = resp.detail + ' Reindirizzamento…';
          okEl.style.display = 'block';
          setTimeout(() => location.href = 'login.html', 1800);
        } catch (err) {
          errEl.textContent = err.message;
          btn.disabled = false;
        }
      });
    </script>
    <script type="module" src="js/site.js"></script>
  </body>
</html>
