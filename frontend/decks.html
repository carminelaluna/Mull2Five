  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/header-logo-orizzontale-su-scuro.svg" alt="Mull2Five" class="brand-logo" />
      </a>
      <nav class="public-nav" aria-label="Navigazione">
        <a href="events.html">Eventi</a>
        <a href="stores.html">Negozi</a>
        <a href="circuits.html">Circuiti</a>
        <a href="decklists.html">Liste</a>
        <a href="organizer.html">Organizza</a>
      </nav>
      <div class="public-auth" id="publicAuth"></div>
    </header>

    <main class="public-main">
      <div class="section-heading" style="margin-bottom:24px">
        <div>
          <span class="eyebrow">Il mio profilo</span>
          <h1>Le mie liste</h1>
        </div>
        <button class="primary" id="newDeck" type="button">+ Nuova lista</button>
      </div>

      <div id="actingBar"></div>
      <div class="decks-layout">
        <aside class="panel decks-list" id="decksList"><p class="empty">Caricamento…</p></aside>
        <section class="panel deck-editor" id="deckEditor"></section>
      </div>
    </main>

    <footer class="public-footer">
      <nav aria-label="Informazioni legali">
        <a href="/privacy.html">Privacy</a>

        <a href="/docs">API</a>
      </nav>

    </footer>

    <!-- Anteprima della carta sotto il puntatore -->
    <div class="card-preview" id="cardPreview" hidden><img alt="" /></div>

    <!-- Dialog: vista grafica della lista -->
    <dialog id="deckViewDialog" class="deck-view-dialog">
      <form method="dialog" class="modal">
        <header>
          <div><span class="eyebrow">Anteprima</span><h2 id="deckViewTitle">Lista</h2></div>
          <button class="icon-button" value="cancel" formnovalidate>&times;</button>
        </header>
        <div id="deckViewBody" class="deck-view-body"></div>
        <menu><button class="secondary" value="cancel" formnovalidate>Chiudi</button></menu>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/decks.js"></script>
    <script type="module" src="js/site.js"></script>
