<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storico tornei — Mull2Five</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:image" content="/og-image-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image-1200x630.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/header-logo-orizzontale-su-scuro.svg" alt="Mull2Five" class="brand-logo" />
      </a>
      <nav class="public-nav" aria-label="Navigazione">
        <a href="events.html" aria-current="page">Eventi</a>
        <a href="stores.html">Negozi</a>
        <a href="circuits.html">Circuiti</a>
        <a href="organizer.html">Organizza</a>
      </nav>
      <div class="public-auth" id="publicAuth"></div>
    </header>

    <main class="public-main">
      <div class="section-heading" style="margin-bottom:16px">
        <div><span class="eyebrow">Albo d'oro</span><h1>Storico tornei</h1></div>
        <input id="histSearch" placeholder="Cerca per nome…" />
      </div>

      <section class="public-events">
        <div id="histList" class="public-events-grid"><p class="empty">Caricamento…</p></div>
      </section>

      <!-- Risultati del torneo selezionato -->
      <section id="histResults" style="display:none;margin-top:24px"></section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/history.js"></script>

    <!-- Dialog: vista grafica decklist -->
    <dialog id="deckViewDialog" class="deck-view-dialog">
      <form method="dialog" class="modal">
        <header>
          <div><span class="eyebrow">Decklist</span><h2 id="deckViewTitle">Lista</h2></div>
          <button class="icon-button" value="cancel" formnovalidate>&times;</button>
        </header>
        <div id="deckViewBody" class="deck-view-body"></div>
        <menu><button class="secondary" value="cancel" formnovalidate>Chiudi</button></menu>
      </form>
    </dialog>
  </body>
</html>
