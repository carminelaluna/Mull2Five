<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back-office — Mull2Five</title>
    <meta name="description" content="Il back-office per negozi e organizzatori: crea tornei, gestisci iscrizioni, pagamenti e staff." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mull2Five" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Back-office — Mull2Five" />
    <meta property="og:description" content="Il back-office per negozi e organizzatori: crea tornei, gestisci iscrizioni, pagamenti e staff." />
    <meta property="og:image" content="__SITE_URL__/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mull2Five — tornei di Magic vicino a te" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image-1200x630.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
    <style>
      .bo-wrap { max-width: 1000px; margin: 0 auto; }
      .bo-tabs { display:flex; gap:6px; flex-wrap:wrap; margin:16px 0; }
      .bo-tab { padding:8px 16px; border:1px solid var(--line,#2a2a31); border-radius:8px;
                background:transparent; color:var(--ink,#ffffff); cursor:pointer; }
      .bo-tab.active { background:var(--teal,#3e8e7e); border-color:var(--teal,#3e8e7e); color:#0f1110; font-weight:600; }
      .bo-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
      table.bo { width:100%; border-collapse:collapse; }
      table.bo th, table.bo td { padding:8px 10px; border-bottom:1px solid var(--line,#2a2a31); text-align:left; font-size:.92rem; }
      table.bo th { color:var(--muted,#9a9aa5); text-transform:uppercase; font-size:.72rem; letter-spacing:.06em; }
      .pill { font-size:.72rem; padding:2px 7px; border-radius:999px; border:1px solid var(--line,#2a2a31); }
      .pill.ok { background:rgba(62,142,126,.18); border-color:var(--teal,#3e8e7e); }
      .pill.warn { background:rgba(224,162,60,.16); border-color:var(--warn,#e0a23c); }
      .pill.danger { background:rgba(239,106,94,.16); border-color:var(--danger,#ef6a5e); }
      .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
      /* Una cella resta una cella: con display:flex il td si stacca dalla riga e
         bordo e altezza non coincidono più con le altre colonne. */
      table.bo td { vertical-align:middle; }
      td.row-actions { display:table-cell; white-space:nowrap; }
      td.row-actions > * + * { margin-left:6px; }
      /* Celle a due piani: lo stato sopra, le azioni sotto, alla stessa altezza in
         ogni colonna, così etichette e pulsanti stanno sulla stessa linea. */
      table.bo.players td { vertical-align:top; }
      .cell { display:grid; grid-template-rows:24px auto; row-gap:6px; }
      .cell-top, .cell-bottom { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
      .cell-top { min-height:24px; }
      .cell-bottom { min-height:34px; }
      .cell-bottom select { width:auto; min-height:34px; padding:4px 8px; }
      .cell-note { font-size:.8rem; margin-top:4px; }
      /* Pulsanti e menu non vanno a capo: sugli schermi stretti scorre la tabella,
         non si spezzano le righe. */
      table.bo .mini-button, table.bo select { white-space:nowrap; }
      table.bo.players .cell-bottom { flex-wrap:nowrap; }
      .table-scroll { overflow-x:auto; }
      /* Menu "⋯" delle azioni meno usate: la riga resta corta e allineata. */
      .row-menu { position:relative; display:inline-block; }
      .row-menu > summary { list-style:none; cursor:pointer; }
      .row-menu > summary::-webkit-details-marker { display:none; }
      .row-menu-list { position:absolute; right:0; top:calc(100% + 4px); z-index:20; display:grid; gap:4px;
                       min-width:170px; padding:6px; border:1px solid var(--line,#2a2a31); border-radius:10px;
                       background:var(--panel,#16161a); box-shadow:0 10px 30px rgba(0,0,0,.45); }
      .row-menu-list .mini-button { width:100%; text-align:left; }
      /* Pod di draft: una scheda per pod, posti in colonna. */
      .pod-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:12px; }
      .pod-card { border:1px solid var(--line,#2a2a31); border-radius:10px; padding:10px 12px; }
      .pod-card h4 { margin:0 0 6px; }
      .pod-card ol { margin:0; padding-left:22px; display:grid; gap:2px; font-size:.9rem; }
      /* Nei moduli a griglia, i campi brevi in coppia occupano mezza riga ciascuno:
         a una colonna sola lascerebbero un vuoto a destra. */
      .bo-grid .span-2 { grid-column:span 2; }
      @media (max-width: 640px) { .bo-grid .span-2 { grid-column:1 / -1; } }
      /* Barre di comandi: etichetta e menu su una riga, menu larghi quanto il contenuto. */
      .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
      .toolbar label { display:flex; align-items:center; gap:6px; white-space:nowrap; margin:0; }
      .toolbar select { width:auto; min-width:180px; }
      input[type="color"] { width:64px; height:38px; padding:2px; cursor:pointer; }
    </style>
  </head>
  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/header-logo-orizzontale-su-scuro.svg" alt="Mull2Five" class="brand-logo" />
      </a>
      <nav class="public-nav" aria-label="Navigazione">
        <a href="events.html">Eventi</a>
        <a href="stores.html">Negozi</a>
        <a href="circuits.html">Circuiti</a>
        <a href="decklists.html">Liste</a>
        <a href="organizer.html" aria-current="page">Organizza</a>
      </nav>
      <div class="public-auth" id="publicAuth"></div>
    </header>

    <main class="public-main bo-wrap">
      <!-- Livello 0: i tuoi eventi. Livello 1: dentro un evento.
           Niente selettore globale nascosto: si entra e si esce da un evento. -->
      <nav class="bo-nav" id="boNav" aria-label="Sezioni">
        <button class="bo-nav-item active" data-section="eventi" type="button">Eventi</button>
        <button class="bo-nav-item" data-section="manifestazioni" type="button">Manifestazioni</button>
        <button class="bo-nav-item" data-section="community" type="button">Community</button>
        <button class="bo-nav-item" data-section="negozio" type="button">Negozio</button>
      </nav>

      <div id="boCrumb" class="bo-crumb" style="display:none"></div>
      <div class="bo-tabs" id="boEventTabs" style="display:none"></div>
      <div id="boWarnings" class="bo-warnings" style="display:none" aria-live="polite"></div>
      <div id="panel"></div>
    </main>

    <dialog id="newEventDialog" class="bo-dialog"></dialog>
    <!-- Modale di servizio della sezione Giocatori: walk-in, lista, penalità. -->
    <dialog id="boDialog" class="bo-dialog"></dialog>

    <!-- Vista grafica della lista, condivisa con le pagine pubbliche. -->
    <dialog id="deckViewDialog" class="deck-view-dialog">
      <form method="dialog" class="modal">
        <header>
          <div><span class="eyebrow">Decklist</span><h2 id="deckViewTitle">Lista</h2></div>
          <button class="icon-button" value="cancel" formnovalidate>&times;</button>
        </header>
        <div id="deckViewBody" class="deck-view-body"></div>
        <menu><button class="secondary" value="cancel" formnovalidate>Chiudi</button></menu>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/organizer.js"></script>
    <script type="module" src="js/site.js"></script>
  </body>
</html>
