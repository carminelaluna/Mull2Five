<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manabind — Trova il tuo torneo MTG</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#b6483f" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">MB</span>
        <span><strong>Manabind</strong></span>
      </a>
      <nav class="public-nav" aria-label="Navigazione">
        <a href="index.html" data-i18n="nav.tournaments">Tornei</a>
        <a href="leaderboard.html" data-i18n="nav.leaderboard">Classifica stagionale</a>
        <a href="my-registrations.html" data-i18n="nav.my">Le mie iscrizioni</a>
        <a href="organizer.html" data-i18n="nav.organize">Organizza</a>
      </nav>
      <div class="public-auth" id="publicAuth">
        <a class="secondary-link" href="login.html" data-i18n="auth.login">Accedi</a>
        <a class="primary-btn" href="login.html" data-i18n="auth.register">Registrati</a>
      </div>
    </header>

    <main class="public-main">
      <section class="public-hero">
        <div class="public-hero-copy">
          <span class="eyebrow" data-i18n="home.eyebrow">MTG Tournament Platform</span>
          <h1 data-i18n="home.title">Trova e partecipa ai tornei Magic vicino a te.</h1>
          <p data-i18n="home.subtitle">Iscriviti, paga l'entry fee, carica la decklist e segui i tuoi pairings — tutto in un posto.</p>
        </div>
      </section>

      <!-- Filtri ricerca -->
      <section class="public-search panel">
        <form id="searchForm" class="search-form-public">
          <label>
            <input id="searchName" placeholder="Nome torneo…" />
          </label>
          <label>
            <select id="searchFormat">
              <option value="">Tutti i formati</option>
              <option>Modern</option><option>Standard</option><option>Pioneer</option>
              <option>Legacy</option><option>Commander</option><option>Sealed</option><option>Draft</option>
            </select>
          </label>
          <label>
            <input id="searchDate" type="date" />
          </label>
          <label>
            <input id="searchCity" placeholder="Città…" />
          </label>
          <button class="primary" type="submit" data-i18n="search.submit">Cerca</button>
        </form>
      </section>

      <!-- Lista tornei -->
      <section class="public-events">
        <div id="eventsList" class="public-events-grid"></div>
        <p id="eventsEmpty" class="empty" style="display:none">Nessun torneo trovato.</p>
        <div id="eventsPagination" class="pagination"></div>
      </section>
    </main>

    <footer class="public-footer">
      <p>© 2026 Manabind · <a href="/docs">API</a></p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
