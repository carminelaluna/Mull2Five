<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Segnalazioni — Mull2Five</title>
    <meta name="description" content="Le segnalazioni aperte e le risposte." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mull2Five" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Segnalazioni — Mull2Five" />
    <meta property="og:description" content="Le segnalazioni aperte e le risposte." />
    <meta property="og:image" content="__SITE_URL__/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mull2Five — tornei di Magic vicino a te" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image-1200x630.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/header-logo-orizzontale-su-scuro.svg" alt="Mull2Five" class="brand-logo" />
      </a>
      <nav class="public-nav" aria-label="Navigazione">
        <a href="events.html">Eventi</a>
        <a href="stores.html">Negozi</a>
        <a href="circuits.html">Circuiti</a>
        <a href="decklists.html">Liste</a>
        <a href="organizer.html">Organizza</a>
      </nav>
      <div class="public-auth" id="publicAuth"></div>
    </header>

    <main class="public-main">
      <div class="section-heading" style="margin-bottom:16px">
        <div><span class="eyebrow">Assistenza</span><h1>Segnalazioni</h1></div>
        <button class="primary" id="newTicket" type="button">+ Nuova segnalazione</button>
      </div>

      <div class="tabs" id="ticketTabs" role="tablist">
        <button class="tab active" data-box="mine" type="button" role="tab">Le mie</button>
        <button class="tab" data-box="inbox" type="button" role="tab" hidden>Ricevute</button>
      </div>

      <section id="ticketList"><p class="empty">Caricamento…</p></section>
    </main>

    <footer class="public-footer">
      <nav aria-label="Informazioni legali">
        <a href="/privacy.html">Privacy</a>
        <a href="/termini.html">Termini</a>
        <a href="/cookie.html">Cookie</a>
        <a href="/docs">API</a>
      </nav>
      <p>© 2026 Mull2Five · Non affiliato a Wizards of the Coast</p>
    </footer>

    <dialog id="ticketDialog">
      <form method="dialog" class="modal">
        <header>
          <div><span class="eyebrow">Assistenza</span><h2>Nuova segnalazione</h2></div>
          <button class="icon-button" value="cancel" formnovalidate>&times;</button>
        </header>
        <label>A chi
          <select id="tkScope">
            <option value="organizer">All'organizzatore di un torneo</option>
            <option value="admin">A chi tiene il sito</option>
          </select>
        </label>
        <label id="tkTournamentRow">Torneo
          <select id="tkTournament"></select>
        </label>
        <label>Oggetto<input id="tkSubject" minlength="3" maxlength="180" /></label>
        <label>Cosa è successo
          <textarea id="tkBody" minlength="3" maxlength="4000" style="min-height:140px"></textarea>
        </label>
        <p class="field-error" id="tkError"></p>
        <menu>
          <button class="secondary" value="cancel" formnovalidate>Annulla</button>
          <button class="primary" id="tkSend" type="button">Invia</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/tickets.js"></script>
    <script type="module" src="js/site.js"></script>
  </body>
</html>
