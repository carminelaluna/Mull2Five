<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Torneo — Mull2Five</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:image" content="/og-image-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image-1200x630.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/header-logo-orizzontale-su-scuro.svg" alt="Mull2Five" class="brand-logo" />
      </a>
      <nav class="public-nav" aria-label="Navigazione">
        <a href="events.html">Eventi</a>
        <a href="stores.html">Negozi</a>
        <a href="circuits.html">Circuiti</a>
        <a href="organizer.html">Organizza</a>
      </nav>
      <div class="public-auth" id="publicAuth"></div>
    </header>

    <main class="public-main">
      <div id="eventDetail" class="event-detail-layout">
        <p class="empty">Caricamento…</p>
      </div>
    </main>

    <!-- Dialog iscrizione -->
    <dialog id="registerDialog">
      <form method="dialog" class="modal" id="registerForm">
        <header>
          <div><span class="eyebrow">Iscrizione</span><h2 id="registerTitle">Iscriviti</h2></div>
          <button class="icon-button" value="cancel" formnovalidate>×</button>
        </header>
        <label>Wizards Account (opzionale)
          <input id="regWizards" placeholder="##########" />
        </label>
        <label>Metodo di pagamento
          <select id="regPayment">
            <option value="stripe">Carta (Stripe)</option>
            <option value="paypal">PayPal</option>
            <option value="sandbox">Sandbox (test)</option>
          </select>
        </label>
        <p id="regError" class="field-error"></p>
        <menu>
          <button class="secondary" value="cancel" formnovalidate>Annulla</button>
          <button class="primary" id="confirmRegister" type="button">Iscriviti e paga</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/event.js"></script>
  </body>
</html>
