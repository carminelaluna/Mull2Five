  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/header-logo-orizzontale-su-scuro.svg" alt="Mull2Five" class="brand-logo" />
      </a>
      <nav class="public-nav" aria-label="Navigazione">
        <a href="events.html">Eventi</a>
        <a href="stores.html">Negozi</a>
        <a href="circuits.html">Circuiti</a>
        <a href="decklists.html" aria-current="page">Liste</a>
        <a href="organizer.html">Organizza</a>
      </nav>
      <div class="public-auth" id="publicAuth"></div>
    </header>

    <main class="public-main">
      <div class="section-heading" style="margin-bottom:16px">
        <div><span class="eyebrow">Archivio</span><h1>Liste dei tornei</h1></div>
      </div>

      <div class="search-layout">
        <aside class="facets" id="facets" aria-label="Filtri"></aside>

        <div>
          <section class="panel archive-meta" id="metaPanel" hidden></section>
          <p class="filter-summary" id="filterSummary"></p>
          <div class="panel" style="padding:4px 8px">
            <table class="results-table">
              <thead>
                <tr><th>Pos.</th><th>Giocatore</th><th>Archetipo</th><th>Torneo</th><th>Record</th></tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
          <div id="resultsPagination" class="pagination"></div>
        </div>
      </div>
    </main>

    <footer class="public-footer">

    </footer>

    <!-- Dialog: la lista scelta -->
    <dialog id="deckViewDialog" class="deck-view-dialog">
      <form method="dialog" class="modal">
        <header>
          <div><span class="eyebrow" id="deckViewEyebrow">Lista</span><h2 id="deckViewTitle">Lista</h2></div>
          <button class="icon-button" value="cancel" formnovalidate>&times;</button>
        </header>
        <div id="deckViewBody" class="deck-view-body"></div>
        <menu>
          <button class="secondary" id="deckCopy" type="button">Copia testo</button>
          <button class="secondary" id="deckSave" type="button" hidden>Salva tra le mie liste</button>
          <button class="primary" value="cancel" formnovalidate>Chiudi</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/decklists.js"></script>
    <script type="module" src="js/site.js"></script>
  </body>
