<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accedi — Mull2Five</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:image" content="/og-image-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image-1200x630.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/login-logo-verticale-su-scuro.svg" alt="Mull2Five" class="brand-logo brand-logo-tall" />
      </a>
    </header>

    <main class="public-main" style="max-width:480px">
      <div class="auth-card" style="margin-top:40px">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" type="button">Accedi</button>
          <button class="auth-tab" id="tabRegister" type="button">Registrati</button>
        </div>

        <!-- Login -->
        <form class="auth-form" id="formLogin">
          <label>Email
            <input id="loginEmail" type="email" required placeholder="player@email.com" autocomplete="email" />
          </label>
          <label>Password
            <input id="loginPassword" type="password" required placeholder="••••••••" autocomplete="current-password" />
          </label>
          <p class="field-error" id="errLogin"></p>
          <button class="primary" type="submit">Accedi</button>
          <p style="margin-top:8px;text-align:right"><a href="forgot-password.html">Password dimenticata?</a></p>
        </form>

        <!-- Registrazione -->
        <form class="auth-form hidden" id="formRegister">
          <label>Nome completo
            <input id="regName" required placeholder="Mario Rossi" autocomplete="name" />
          </label>
          <label>Email
            <input id="regEmail" type="email" required placeholder="player@email.com" autocomplete="email" />
          </label>
          <label>Password
            <input id="regPassword" type="password" required placeholder="Min. 8 caratteri" autocomplete="new-password" />
          </label>
          <label>Conferma password
            <input id="regConfirm" type="password" required placeholder="Ripeti la password" autocomplete="new-password" />
          </label>
          <label class="reg-check"><input type="checkbox" id="regAge" />
            <span>Ho almeno <span id="regAgeYears">14</span> anni</span></label>
          <label>Tipo di account
            <select id="regRole">
              <option value="player">Giocatore — mi iscrivo ai tornei</option>
              <option value="organizer">Organizzatore — gestisco i tornei del negozio</option>
            </select>
          </label>
          <p class="field-error" id="errRegister"></p>
          <button class="primary" type="submit">Crea account</button>
        </form>
      </div>
    </main>

    <script type="module" src="js/login-public.js"></script>
  </body>
</html>
