<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accedi — Mull2Five</title>
    <meta name="description" content="Accedi o crea il tuo account Mull2Five per iscriverti ai tornei di Magic e gestire le tue liste." />
    <link rel="canonical" href="__SITE_URL__/login.html" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mull2Five" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Accedi — Mull2Five" />
    <meta property="og:description" content="Accedi o crea il tuo account Mull2Five per iscriverti ai tornei di Magic e gestire le tue liste." />
    <meta property="og:url" content="__SITE_URL__/login.html" />
    <meta property="og:image" content="__SITE_URL__/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mull2Five — tornei di Magic vicino a te" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image-1200x630.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="public-header">
      <a class="brand" href="index.html">
        <img src="/brand/login-logo-verticale-su-scuro.svg" alt="Mull2Five" class="brand-logo brand-logo-tall" />
      </a>
    </header>

    <main class="public-main" style="max-width:480px">
      <div class="auth-card" style="margin-top:40px">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin" type="button">Accedi</button>
          <button class="auth-tab" id="tabRegister" type="button">Registrati</button>
        </div>

        <!-- Login -->
        <form class="auth-form" id="formLogin">
          <label>Email
            <input id="loginEmail" type="email" required placeholder="player@email.com" autocomplete="email" />
          </label>
          <label>Password
            <input id="loginPassword" type="password" required placeholder="••••••••" autocomplete="current-password" />
          </label>
          <p class="field-error" id="errLogin"></p>
          <button class="primary" type="submit">Accedi</button>
          <p style="margin-top:8px;text-align:right"><a href="forgot-password.html">Password dimenticata?</a></p>
        </form>

        <!-- Registrazione -->
        <form class="auth-form hidden" id="formRegister">
          <label>Nome completo
            <input id="regName" required placeholder="Mario Rossi" autocomplete="name" />
          </label>
          <label>Email
            <input id="regEmail" type="email" required placeholder="player@email.com" autocomplete="email" />
          </label>
          <label>Password
            <input id="regPassword" type="password" required placeholder="Min. 8 caratteri" autocomplete="new-password" />
          </label>
          <label>Conferma password
            <input id="regConfirm" type="password" required placeholder="Ripeti la password" autocomplete="new-password" />
          </label>
          <label class="reg-check"><input type="checkbox" id="regAge" />
            <span>Ho almeno <span class="age-years" id="regAgeYears">14</span> anni</span></label>
          <label class="reg-check"><input type="checkbox" id="regTerms" />
            <span>Accetto i termini d'uso e l'informativa privacy</span></label>
          <p class="reg-legal-links"><a href="termini.html" target="_blank" rel="noopener">Termini</a> · <a href="privacy.html" target="_blank" rel="noopener">Privacy</a></p>
          <label>Tipo di account
            <select id="regRole">
              <option value="player">Giocatore — mi iscrivo ai tornei</option>
              <option value="organizer">Organizzatore — gestisco i tornei del negozio</option>
            </select>
          </label>
          <p class="field-error" id="errRegister"></p>
          <button class="primary" type="submit">Crea account</button>
        </form>

        <!-- Con Google: compare solo se il server ha le credenziali (/api/auth/rules) -->
        <div class="google-box hidden" id="googleBox">
          <p class="auth-divider"><span>oppure</span></p>
          <button class="secondary google-btn" id="googleBtn" type="button">
            <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span id="googleLabel">Accedi con Google</span>
          </button>
        </div>

        <!-- Primo accesso con Google: i dati che Google non dà -->
        <form class="auth-form hidden" id="formGoogle">
          <p class="muted">Ultimo passo per creare il tuo account con Google:</p>
          <p class="google-email" id="googleEmail" translate="no"></p>
          <label>Nome completo
            <input id="googleName" required placeholder="Mario Rossi" autocomplete="name" />
          </label>
          <label class="reg-check"><input type="checkbox" id="googleAge" />
            <span>Ho almeno <span class="age-years">14</span> anni</span></label>
          <label class="reg-check"><input type="checkbox" id="googleTerms" />
            <span>Accetto i termini d'uso e l'informativa privacy</span></label>
          <p class="reg-legal-links"><a href="termini.html" target="_blank" rel="noopener">Termini</a> · <a href="privacy.html" target="_blank" rel="noopener">Privacy</a></p>
          <label>Tipo di account
            <select id="googleRole">
              <option value="player">Giocatore — mi iscrivo ai tornei</option>
              <option value="organizer">Organizzatore — gestisco i tornei del negozio</option>
            </select>
          </label>
          <p class="field-error" id="errGoogle"></p>
          <button class="primary" type="submit">Crea account</button>
        </form>
      </div>
    </main>

    <footer class="public-footer">
      <nav aria-label="Informazioni legali">
        <a href="/privacy.html">Privacy</a>
        <a href="/termini.html">Termini</a>
        <a href="/cookie.html">Cookie</a>
        <a href="/docs">API</a>
      </nav>
      <p>© 2026 Mull2Five · Non affiliato a Wizards of the Coast</p>
    </footer>

    <script type="module" src="js/login-public.js"></script>
    <script type="module" src="js/site.js"></script>
  </body>
</html>
