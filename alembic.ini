# Configurazione Alembic — Arcana Events
# La URL del database e il target metadata sono impostati in migrations/env.py
# (legge backend.app.core.config.get_settings().database_url).
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Nessuna sqlalchemy.url qui: viene presa dalle settings dell'app a runtime.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
