# Alembic — le modifiche allo schema del database.
#
# L'indirizzo del database non sta qui: lo legge migrations/env.py dalle
# impostazioni dell'app (DATABASE_URL), così vale lo stesso in sviluppo,
# nei test e in produzione.
#
#   alembic revision --autogenerate -m "cosa cambia"   # scrive la migrazione
#   alembic upgrade head                               # la applica
#
# All'avvio l'app fa da sé: vedi backend/app/db.py.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
