name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────
  backend:
    # In produzione c'e' Postgres: i test girano su entrambi i database, cosi'
    # le differenze fra i due dialetti si vedono qui e non online.
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: SQLite
            database_url: sqlite:///./test.db
          - db: PostgreSQL
            database_url: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mull2five_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mull2five_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          SECRET_KEY:   ci-test-secret-key-32-chars-long!!

      - name: Tests
        run: pytest --tb=short
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          SECRET_KEY:   ci-test-secret-key-32-chars-long!!

  # ── Frontend ─────────────────────────────────────────
  frontend:
    name: Frontend (Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:run

      - name: Build
        run: npm run build

  # ── E2E (solo su push a main) ─────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # I test E2E girano contro il backend vero: senza Python non parte.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        working-directory: .
        run: pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
