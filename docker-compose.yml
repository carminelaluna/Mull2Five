services:
  db:
    image: postgres:16-alpine
    environment:
      # Credenziali da .env in produzione; default solo per sviluppo locale.
      POSTGRES_DB: ${POSTGRES_DB:-mull2five}
      POSTGRES_USER: ${POSTGRES_USER:-mull2five}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mull2five}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mull2five} -d $${POSTGRES_DB:-mull2five}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mull2five}:${POSTGRES_PASSWORD:-mull2five}@db:5432/${POSTGRES_DB:-mull2five}
      REDIS_URL: redis://redis:6379/0
      APP_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://127.0.0.1:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup:
    build: .
    profiles: ["backup"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mull2five}:${POSTGRES_PASSWORD:-mull2five}@db:5432/${POSTGRES_DB:-mull2five}
      BACKUP_DIR: /backups
      RETENTION_DAYS: "14"
    volumes:
      - ./backups:/backups
    entrypoint: ["bash", "scripts/backup_db.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

