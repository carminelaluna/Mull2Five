# Il servizio online, scritto invece che cliccato.
#
# Finora la configurazione stava solo nel cruscotto di Render: il 29/09/2026,
# con un deploy fermo, non c'era modo di vedere da qui se il deploy automatico
# fosse acceso, quale comando girasse o quali variabili esistessero. Con due
# ambienti quel buio raddoppia, e le differenze fra prod e staging diventano
# invisibili proprio quando servono.
#
# ATTENZIONE, prima di usarlo:
#
# 1. Questo file **non fa niente** finché non crei un Blueprint da questo
#    repository. Averlo qui non tocca il servizio che sta girando.
# 2. `name` deve coincidere **esattamente** con il nome del servizio che esiste,
#    altrimenti Render ne crea un secondo invece di adottare quello.
# 3. Le variabili con `sync: false` restano quelle del cruscotto: il Blueprint
#    non le legge e non le scrive. Tutti i segreti stanno lì, perché questo
#    repository è pubblico.
# 4. Le variabili con un valore scritto qui **sovrascrivono** il cruscotto
#    quando applichi il Blueprint. Controllale una per una prima di applicare.

services:
  - type: web
    name: mull2five            # deve coincidere col servizio esistente
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt          # lo stesso di Supabase: il database è lì accanto
    plan: starter              # sempre acceso; il gratuito si addormentava dopo 15 minuti
    branch: main
    # Il push su main va in produzione da solo, ma solo con la CI verde: dal
    # 24/11/2026. Prima partiva comunque, e il 23/09 è uscito un commit rosso.
    autoDeployTrigger: checksPass
    healthCheckPath: /health

    envVars:
      # ── Identità dell'ambiente ────────────────────────────────────────────
      # Decide chi finisce nei motori di ricerca: una copia risponde
      # "Disallow: /" e manda X-Robots-Tag. Vedi core/config.py, `is_copy`.
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Mull2Five
      # Il dominio vero dal 23/11/2026 (docs/hosting.md, "Passo 8"). SITE_URL
      # decide anche il redirect da onrender.com al dominio (main.py) e gli
      # indirizzi scritti nelle pagine alla build (Dockerfile).
      - key: APP_URL
        value: https://mull2five.it
      - key: FRONTEND_URL
        value: https://mull2five.it
      - key: SITE_URL
        value: https://mull2five.it

      # ── Database ──────────────────────────────────────────────────────────
      # Supabase, session pooler. La stringa contiene la password: mai qui.
      - key: DATABASE_URL
        sync: false
      # Un PostgreSQL gestito regge poche connessioni: senza questi il pool
      # punta a 80 e le esaurisce.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      # ── Segreti: tutti dal cruscotto ──────────────────────────────────────
      - key: SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_ENV
        sync: false
      # Mai acceso qui: il checkout finto segnerebbe pagata un'iscrizione senza
      # incassare. Fino al 23/11/2026 era rimasto al default, cioè acceso.
      - key: PAYMENT_SANDBOX_MOCK
        value: "false"
      # Solo pagamento al banco finché i pagamenti online non passano dal legale
      # (docs/hosting.md, "Pagamenti"). Si provano sullo staging.
      - key: ONLINE_PAYMENTS_ENABLED
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      # Caselle a parte per l'accesso e i pagamenti (docs/hosting.md, punto 5).
      - key: SMTP_ACCOUNT_FROM_EMAIL
        sync: false
      - key: SMTP_ACCOUNT_USERNAME
        sync: false
      - key: SMTP_ACCOUNT_PASSWORD
        sync: false
      - key: SMTP_PAYMENTS_FROM_EMAIL
        sync: false
      - key: SMTP_PAYMENTS_USERNAME
        sync: false
      - key: SMTP_PAYMENTS_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Accesso con Google: il client OAuth di produzione (docs/hosting.md,
      # "Accesso con Google"). Senza, il bottone non compare.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # L'app Android (docs/android.md): le impronte SHA-256 dei certificati che
      # la firmano — la chiave di Google Play e quella di caricamento, separate
      # da virgola. Non sono segrete, ma arrivano dalla Play Console. Senza,
      # l'app si apre con la barra dell'indirizzo. Il pacchetto resta quello
      # predefinito, it.mull2five.app.
      - key: ANDROID_CERT_FINGERPRINTS
        sync: false
      # Senza, /metrics in produzione risponde 404 (main.py). Con: si legge con
      # `Authorization: Bearer <token>`.
      - key: METRICS_TOKEN
        sync: false
      # Il battito verso Healthchecks.io: l'indirizzo di ping del controllo
      # (docs/hosting.md, "Avvisi su Telegram"). Solo la produzione.
      - key: HEARTBEAT_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # ── Avvisi operativi ──────────────────────────────────────────────────
      - key: ALERT_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Le email che arrivano alle caselle SMTP_*, su Telegram: pop.securemail.pro
      # (non mail.securemail.pro, che rifiuta l'accesso: docs/hosting.md)
      - key: IMAP_HOST
        sync: false

      # ── Dati legali, mostrati in privacy.html e termini.html ──────────────
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_EMAIL
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_VAT_ID
        sync: false

      # ── Interruttori ──────────────────────────────────────────────────────
      # Spento: le condizioni d'uso di Wizards vietano la raccolta automatica.
      - key: WIZARDS_LOCATOR_ENABLED
        value: "false"
      - key: ENABLED_GAMES
        value: mtg
      - key: ANALYTICS_ENABLED
        value: "true"

  # ── Staging ───────────────────────────────────────────────────────────────
  # Stessa immagine, ramo `develop`, database suo. Si lavora qui, si guarda, e
  # solo dopo si fonde in `main`. Creato il 29/09/2026.
  - type: web
    name: mull2five-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    branch: develop
    autoDeploy: true
    healthCheckPath: /health

    envVars:
      # Senza `staging` qui, questo ambiente finisce nei motori di ricerca
      # accanto a quello vero: gli stessi eventi su due domini, e un giocatore
      # arrivato da Google si iscrive a un torneo che non esiste.
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: Mull2Five
      - key: APP_URL
        value: https://mull2five-staging.onrender.com
      - key: FRONTEND_URL
        value: https://mull2five-staging.onrender.com
      - key: SITE_URL
        value: https://mull2five-staging.onrender.com

      # Un altro progetto Supabase. Mai quello di produzione: uno staging
      # puntato al database vero cancella dati veri.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      # Diversa da quella di produzione, o un token emesso qui aprirebbe il
      # sito vero.
      - key: SECRET_KEY
        sync: false

      # I pagamenti restano simulati. Con le chiavi vere, una prova incasserebbe
      # soldi veri da un giocatore.
      - key: PAYMENT_SANDBOX_MOCK
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      # Qui i pagamenti online si provano: Stripe in modalità test, PayPal sandbox.
      - key: ONLINE_PAYMENTS_ENABLED
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

      # Accesso con Google: un client OAuth suo, non quello di produzione.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # L'app Android di prova (android/staging): un pacchetto suo, così sul
      # telefono sta accanto a quella vera. Le impronte sono quelle delle chiavi
      # di debug dei PC che la compilano (le stampa android/compila.ps1).
      - key: ANDROID_PACKAGE
        value: it.mull2five.app.staging
      - key: ANDROID_CERT_FINGERPRINTS
        sync: false

      # Vuote di proposito: una copia che manda email scrive a persone vere.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ALERT_EMAIL
        sync: false

      - key: ENABLED_GAMES
        value: mtg
      - key: WIZARDS_LOCATOR_ENABLED
        value: "false"
      - key: ANALYTICS_ENABLED
        value: "true"
