[project]
name = "mull2five"
version = "0.1.0"
description = "Tournament organizer backend for MTG events."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "email-validator>=2.2.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib>=1.7.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "stripe>=10.0.0",
  "slowapi>=0.1.9",
  "redis>=5.0.0",
  "prometheus-client>=0.20.0",
  "pywebpush>=2.0.0",
  # I fusi orari per zoneinfo: l'immagine python-slim può non averli.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "locust>=2.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",   # Depends() in FastAPI signatures è il pattern idiomatico
  "E501",   # le righe lunghe in migrate_existing_schema sono intenzionali (leggibilità)
]

[tool.ruff.lint.per-file-ignores]
"tests/*"      = ["F401"]                            # import inutilizzati nei file di test
"tests/load/*" = ["E401", "E701", "E702", "F811"]    # one-liner intenzionali nei load test

[tool.pytest.ini_options]
testpaths = ["tests"]
# esclude i load test da pytest standard
addopts   = "--ignore=tests/load"

[tool.setuptools.packages.find]
include = ["backend*"]
